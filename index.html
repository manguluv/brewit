<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1512">
  <title>BrewIt! ☕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Recipe List -->
    <section id="view-list" class="view active">
      <div class="header">
        <h1>☕ BrewIt!</h1>
        <p class="subtitle">커피 레시피 &amp; 브루잉 타이머</p>
      </div>
      <div id="recipe-list" class="recipe-list"></div>
      <button class="fab" id="add-recipe-btn" title="레시피 추가">＋</button>
    </section>

    <!-- Recipe Detail -->
    <section id="view-detail" class="view">
      <button class="back-btn" onclick="navigate('list')">← 목록</button>
      <div id="recipe-detail"></div>
    </section>

    <!-- Add Recipe -->
    <section id="view-add" class="view">
      <button class="back-btn" onclick="navigate('list')">← 취소</button>
      <div class="header"><h1>레시피 추가</h1></div>
      <form id="add-recipe-form" class="add-form" onsubmit="return false"></form>
    </section>

    <!-- Timer -->
    <section id="view-timer" class="view">
      <button class="back-btn" id="timer-back-btn">← 레시피</button>
      <div id="timer-content"></div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
